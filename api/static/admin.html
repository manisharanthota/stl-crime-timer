<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>STL Crime Timer Admin</title>
<style>
  :root {
    --bg: #f7f6f3; --card: #ffffff; --text: #1c1c1e; --muted: #6b6b70;
    --border: #e3e1dc; --accent: #b3261e; --link: #1a5fb4; --ok: #2e7d32;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121214; --card: #1c1c20; --text: #ececf0; --muted: #9a9aa3;
      --border: #2e2e34; --accent: #ff8a80; --link: #8ab4f8; --ok: #81c995;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 820px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 1.6rem; margin: 0 0 16px; }
  h2 { font-size: 1.1rem; margin: 32px 0 12px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  label { display: block; font-size: 0.875rem; color: var(--muted); margin: 0 0 4px; }
  input[type=text], input[type=password], input[type=number], input[type=datetime-local] {
    width: 100%; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-bottom: 12px;
  }
  .check { display: flex; align-items: center; gap: 8px; color: var(--text); font-size: 1rem; margin-bottom: 12px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .row input { flex: 1 1 120px; margin-bottom: 0; }
  button {
    font: inherit; font-weight: 600; padding: 8px 16px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--accent); background: var(--accent); color: var(--card);
  }
  button.secondary { background: transparent; color: var(--text); border-color: var(--border); }
  button:disabled { opacity: 0.6; cursor: default; }
  .msg { margin: 12px 0 0; font-size: 0.95rem; }
  .msg.err { color: var(--accent); }
  .msg.ok { color: var(--ok); }
  .muted { color: var(--muted); font-size: 0.875rem; }
  .tag { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--accent); margin-right: 8px; }
  .approx { font-size: 0.75rem; font-weight: 600; color: var(--accent); border: 1px solid currentColor; border-radius: 6px; padding: 0 6px; margin-left: 6px; white-space: nowrap; }
  ul.list { list-style: none; margin: 0; padding: 0; }
  ul.list > li { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; margin-bottom: 8px; }
  ul.list > li .row { justify-content: space-between; }
  .articles { margin: 6px 0 12px; padding-left: 18px; font-size: 0.9rem; }
  a { color: var(--link); overflow-wrap: anywhere; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Admin</h1>

  <form id="login" class="card" autocomplete="off">
    <label for="token">Admin token</label>
    <input id="token" type="password" autocomplete="off" required>
    <div class="row">
      <button type="submit">Sign in</button>
      <span class="muted">Kept only in this tab (sessionStorage) until you close it.</span>
    </div>
    <p class="msg err" id="login-msg" role="alert" hidden></p>
  </form>

  <div id="app" hidden>
    <div class="row" style="justify-content: space-between">
      <form id="open" class="row" style="flex: 1 1 260px">
        <input id="open-id" type="number" min="1" placeholder="Incident id" aria-label="Incident id">
        <button type="submit" class="secondary">Open</button>
      </form>
      <button type="button" class="secondary" id="logout">Sign out</button>
    </div>
    <p class="msg" id="app-msg" role="status" hidden></p>

    <section id="editor" hidden>
      <h2 id="ed-title"></h2>
      <div class="card">
        <div class="muted" id="ed-meta"></div>
        <ul class="articles" id="ed-articles"></ul>
        <form id="ed-form">
          <label for="ed-time">When it happened (St. Louis time)</label>
          <input id="ed-time" type="datetime-local" required>
          <label class="check"><input id="ed-estimated" type="checkbox"> Time is approximate</label>
          <label for="ed-location">Location</label>
          <input id="ed-location" type="text" maxlength="300">
          <label for="ed-neighborhood">Neighborhood (official name, or empty)</label>
          <input id="ed-neighborhood" type="text" maxlength="100">
          <div class="row">
            <button type="submit" id="ed-save">Save</button>
            <button type="button" class="secondary" id="ed-confirm">Confirm</button>
            <button type="button" class="secondary" id="ed-reject">Reject</button>
          </div>
          <p class="msg" id="ed-msg" role="status" hidden></p>
        </form>
      </div>
    </section>

    <h2>Needs review</h2>
    <ul class="list" id="review"><li class="muted">Loading…</li></ul>

    <h2>Estimated times not yet checked</h2>
    <ul class="list" id="estimated"><li class="muted">Loading…</li></ul>
  </div>
</main>
<script>
(() => {
  const KEY = "stl-admin-token";
  const TZ = "America/Chicago";
  const LABEL = { shooting: "Shooting", burglary: "Burglary", homicide: "Killing" };
  const fmt = new Intl.DateTimeFormat("en-US", {
    timeZone: TZ, weekday: "short", month: "short", day: "numeric", year: "numeric",
    hour: "numeric", minute: "2-digit", timeZoneName: "short",
  });
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", hourCycle: "h23",
  });

  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  };
  const storage = {
    get() { try { return sessionStorage.getItem(KEY); } catch { return null; } },
    set(v) { try { sessionStorage.setItem(KEY, v); } catch { /* memory only */ } },
    clear() { try { sessionStorage.removeItem(KEY); } catch { /* nothing */ } },
  };
  let token = storage.get();
  let current = null;  // the incident open in the editor

  // UTC ISO -> "YYYY-MM-DDTHH:MM" in St. Louis time, for <input type=datetime-local>.
  function localValue(iso) {
    const p = Object.fromEntries(parts.formatToParts(new Date(iso)).map((x) => [x.type, x.value]));
    return `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}`;
  }

  function show(id, text, kind) {
    const m = $(id);
    m.textContent = text;
    m.className = "msg" + (kind ? " " + kind : "");
    m.hidden = !text;
  }

  class AuthError extends Error {}

  // Every call sends the token as a header; it never goes in a URL.
  async function api(method, path, body) {
    const opts = { method, headers: { "X-Admin-Token": token }, cache: "no-store" };
    if (body !== undefined) {
      opts.headers["Content-Type"] = "application/json";
      opts.body = JSON.stringify(body);
    }
    const r = await fetch(path, opts);
    let data = null;
    try { data = await r.json(); } catch { /* empty body */ }
    const detail = data && data.detail;
    const text = Array.isArray(detail) ? detail.map((d) => d.msg).join("; ") : detail;
    if (r.status === 401) throw new AuthError(text === "Missing X-Admin-Token"
      ? "Enter the admin token." : "Wrong admin token. Check it and try again.");
    if (r.status === 429) {
      const wait = Math.ceil((+r.headers.get("Retry-After") || 60) / 60);
      throw new AuthError(`${text || "Too many attempts"}. Try again in about ${wait} min.`);
    }
    if (r.status === 503) throw new AuthError("Admin is turned off on the server (ADMIN_TOKEN is not set).");
    if (!r.ok) throw new Error(text || `Request failed (${r.status})`);
    return data;
  }

  function signedOut(message) {
    token = null;
    storage.clear();
    $("app").hidden = true;
    $("login").hidden = false;
    show("login-msg", message || "", "err");
    $("token").focus();
  }

  // Auth problems send you back to the token form with the reason; others show inline.
  async function guard(fn, msgId) {
    try {
      return await fn();
    } catch (e) {
      if (e instanceof AuthError) signedOut(e.message);
      else show(msgId, e.message, "err");
    }
  }

  const label = (inc) => (inc.crime_type === "homicide" && inc.was_shooting
    ? "Fatal shooting" : LABEL[inc.crime_type] || inc.crime_type);

  function whenNode(inc) {
    const span = el("span", null, fmt.format(new Date(inc.occurred_at)));
    if (inc.time_estimated) span.append(el("span", "approx", "time approximate"));
    if (inc.manual_occurred_at) span.append(el("span", "muted", " · set by hand"));
    return span;
  }

  function renderList(id, list, empty) {
    const ul = $(id);
    ul.replaceChildren();
    if (!list.length) { ul.append(el("li", "muted", empty)); return; }
    for (const inc of list) {
      const li = el("li");
      const row = el("div", "row");
      const left = el("div");
      left.append(el("span", "tag", `#${inc.id} ${label(inc)}`),
        el("span", null, inc.location || "Location not reported"));
      const when = el("div", "muted");
      when.append(whenNode(inc), ` · ${inc.status}`);
      left.append(when);
      const btn = el("button", "secondary", "Edit");
      btn.type = "button";
      btn.addEventListener("click", () => { location.hash = `incident=${inc.id}`; });
      row.append(left, btn);
      li.append(row);
      ul.append(li);
    }
  }

  async function loadLists() {
    await guard(async () => {
      const [review, estimated] = await Promise.all([
        api("GET", "/admin/review"), api("GET", "/admin/estimated"),
      ]);
      renderList("review", review, "Nothing to review.");
      renderList("estimated", estimated, "No unchecked estimated times.");
    }, "app-msg");
  }

  function renderEditor(inc) {
    current = inc;
    $("editor").hidden = false;
    $("ed-title").textContent = `#${inc.id} ${label(inc)}`;
    const meta = $("ed-meta");
    meta.replaceChildren(`Status: ${inc.status} · `, whenNode(inc));
    const arts = $("ed-articles");
    arts.replaceChildren();
    for (const a of inc.articles) {
      const li = el("li");
      const link = el("a", null, a.title);
      if (/^https?:\/\//i.test(a.url)) link.href = a.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      const pub = a.published_at ? `, published ${fmt.format(new Date(a.published_at))}` : "";
      li.append(link, el("span", "muted", ` — ${a.source_name}${pub}`));
      arts.append(li);
    }
    $("ed-time").value = localValue(inc.occurred_at);
    $("ed-estimated").checked = inc.time_estimated;
    $("ed-location").value = inc.location || "";
    $("ed-neighborhood").value = inc.neighborhood || "";
    $("ed-confirm").disabled = inc.status === "confirmed" || inc.status === "merged";
    $("ed-reject").disabled = inc.status === "rejected" || inc.status === "merged";
    $("ed-save").disabled = inc.status === "merged";
  }

  async function openFromHash() {
    const m = /incident=(\d+)/.exec(location.hash);
    if (!m) { $("editor").hidden = true; current = null; return; }
    show("ed-msg", "");
    show("app-msg", "");
    await guard(async () => {
      renderEditor(await api("GET", `/admin/incidents/${m[1]}`));
      $("editor").scrollIntoView({ block: "start" });
    }, "app-msg");
  }

  $("ed-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!current) return;
    const body = {};
    const time = $("ed-time").value;
    const estimated = $("ed-estimated").checked;
    // Sent naive: the server reads it as St. Louis time.
    if (time && time !== localValue(current.occurred_at)) body.occurred_at = `${time}:00`;
    if (estimated !== current.time_estimated || body.occurred_at) body.time_estimated = estimated;
    const loc = $("ed-location").value.trim();
    if (loc !== (current.location || "")) body.location = loc || null;
    const hood = $("ed-neighborhood").value.trim();
    if (hood !== (current.neighborhood || "")) body.neighborhood = hood || null;
    if (!Object.keys(body).length) return show("ed-msg", "Nothing changed.", "");
    await guard(async () => {
      renderEditor(await api("PATCH", `/admin/incidents/${current.id}`, body));
      show("ed-msg", "Saved. Later pipeline runs won't change these fields.", "ok");
      loadLists();
    }, "ed-msg");
  });

  for (const [id, action] of [["ed-confirm", "confirm"], ["ed-reject", "reject"]]) {
    $(id).addEventListener("click", async () => {
      if (!current) return;
      await guard(async () => {
        renderEditor(await api("POST", `/admin/incidents/${current.id}/${action}`));
        show("ed-msg", action === "confirm" ? "Confirmed." : "Rejected.", "ok");
        loadLists();
      }, "ed-msg");
    });
  }

  $("open").addEventListener("submit", (e) => {
    e.preventDefault();
    const id = $("open-id").value;
    if (id) location.hash = `incident=${id}`;
  });

  async function start() {
    $("login").hidden = true;
    $("app").hidden = false;
    show("login-msg", "");
    await loadLists();
    if (token) openFromHash();
  }

  $("login").addEventListener("submit", async (e) => {
    e.preventDefault();
    const value = $("token").value.trim();
    if (!value) return show("login-msg", "Enter the admin token.", "err");
    token = value;
    $("token").value = "";
    // Check it before keeping it.
    try {
      await api("GET", "/admin/review");
    } catch (err) {
      return signedOut(err instanceof AuthError ? err.message : `Couldn't reach the server: ${err.message}`);
    }
    storage.set(token);
    start();
  });

  $("logout").addEventListener("click", () => signedOut(""));
  window.addEventListener("hashchange", () => { if (token) openFromHash(); });

  if (token) start(); else signedOut("");
})();
</script>
</body>
</html>
